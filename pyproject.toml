[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditorydecoding"
version = "0.1.0"
description = "Auditory decoding of brain activity in different animals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "mne==1.11.0",
    "mne-bids==0.18",
    "scikit-learn==1.7.2",
    "torch>=2.12.1",
    "torch-brain",
]

[tool.uv.sources]
torch-brain = { git = "https://github.com/neuro-galaxy/torch_brain", branch = "main" }

[dependency-groups]
dev = ["pre-commit>=4.5.1", "ruff>=0.15.4"]
notebooks = ["ipykernel"]

[tool.ruff]
line-length = 80
format.preview = true
extend-exclude = ["*.ipynb"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.build.targets.sdist]
include = ["auditorydecoding*"]

[tool.hatch.build.targets.wheel]
include = ["auditorydecoding*"]
